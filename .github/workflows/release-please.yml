name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download pinned kubectl binaries
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const pins = JSON.parse(await readFile('kubectl-pins.json', 'utf8'));
          await mkdir('vendor', { recursive: true });
          for (const pin of Object.values(pins.binaries)) {
            const response = await fetch(pin.url);
            if (!response.ok) throw new Error(`Download failed: ${response.status} ${pin.url}`);
            await writeFile(`vendor/${pin.file}`, Buffer.from(await response.arrayBuffer()));
          }
          NODE

      - run: npm ci

      - run: npm run build

      # setup-node writes a placeholder auth token; remove it so npm uses OIDC.
      - name: Enable OIDC trusted publishing
        run: sed -i '/:_authToken=/d' "$NPM_CONFIG_USERCONFIG"

      - run: npm publish --access public --provenance
